      main: Now I decide what goes into them.
      note: Same turn, but it names what a PM actually does.
    - id: h3
      lead: I don't write the code.
      main: I own everything else.
      note: Leads with the AI-built angle and is upfront about not coding.
    - id: h4
      lead: ""
      main: I frame the problem, make the call, write the spec and ship it.
