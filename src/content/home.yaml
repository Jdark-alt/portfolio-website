howIWork:
  id: how-i-work
  title: How I work
  intro: >-
    Six steps I repeat on every change. Each one links to the place it actually
    happened, once in each product.
  steps:
    - name: Frame
      principle: Turn a complaint into a problem worth solving, and say who has it.
      evidence:
        - project: Mindkraft
          text: Made a 3-level setup optional so new users earn XP first
          href: /work/mindkraft/#framing
        - project: TPTD
          text: Reframed "nerf wall charges" as a two-sided tug-of-war
          href: /work/tptd/#framing
    - name: Decide
      principle: Write down the options, pick one, and record what it costs.
      evidence:
        - project: Mindkraft
          text: Grit can be earned, never bought
          href: /work/mindkraft/#decisions
        - project: TPTD
          text: Chose an exploit fix from simulation data
          href: /work/tptd/#decisions
    - name: Spec
      principle: Non-goals, open decisions and tests in every handoff, because AI agents fill gaps with guesses.
      evidence:
        - project: Mindkraft
          text: 15+ specs, with scenario tests A to H
          href: /work/mindkraft/#building
        - project: TPTD
          text: 15 acceptance tests in the v34 spec
          href: /work/tptd/#building
    - name: Ship
      principle: Ship behind a safety net of tags, test builds, previews and gates.
      evidence:
        - project: Mindkraft
          text: Test repo, then branch previews, then the 3.0 release
          href: /work/mindkraft/#building
        - project: TPTD
          text: 25 builds in five weeks, none live without my sign-off
          href: /work/tptd/#building
    - name: Measure
      principle: Report the number, the gap, and what I didn't measure.
      evidence:
        - project: Mindkraft
          text: 50 sign-ups, 26 weekly actives, only 2 analytics events
          href: /work/mindkraft/#measuring
        - project: TPTD
          text: 258 bot matches per mode before v33 shipped
          href: /work/tptd/#simulation-gate
    - name: Iterate
      principle: Each version answers a finding from the last one.
      evidence:
        - project: Mindkraft
          text: The AI skill map rebuilt three times in 11 days
          href: /work/mindkraft/#iteration
        - project: TPTD
          text: Sabotage reworked across 8 builds
          href: /work/tptd/#iteration

